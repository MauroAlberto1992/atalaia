[project]
name = "minicop"
version = "0.1.0"
description = "Mini Common Operational Picture: live AIS ship tracks off the Portuguese coast"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "pydantic>=2",
    "python-dotenv>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "asyncpg>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # required by FastAPI TestClient
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4",
    "asyncpg-stubs>=0.32",  # type information for mypy
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (likely bugs),
# UP modern syntax, ASYNC asyncio pitfalls, SIM simplifications.
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
