[project]
name = "minicop"
version = "0.1.0"
description = "Mini Common Operational Picture: live AIS ship tracks off the Portuguese coast"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "pydantic>=2",
    "python-dotenv>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: required by FastAPI TestClient

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
