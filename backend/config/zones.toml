# Fixed zones of interest (optional). Any zone added here must have a real source,
# or end its name in "(demo)" so it is clear on the map and in alerts.
# polygon: list of [lat, lon] vertices — LATITUDE FIRST, like areas.toml.
#   The polygon is closed automatically (don't repeat the first vertex).
# kind: drives the colour on the map ("restricted", "protected", "speed").
# alert_on_entry: raise an alert when a ship enters / leaves.
# max_speed_kn: raise an alert when a ship inside goes faster than this.
# Every zone also raises "dark ship" alerts (a ship goes silent inside it).
# No zones are configured: the demo zones were removed (coastal ones in phase 13,
# the offshore "Algarve exercise area (demo)" in phase 16). Operators draw their
# own areas on the map (phase 16). Example of the format:
#
# [[zones]]
# name = "Example area"
# kind = "restricted"
# alert_on_entry = true
# polygon = [[36.900, -8.550], [36.900, -8.300], [36.800, -8.300], [36.800, -8.550]]

# Port areas are no longer here: they come from OpenStreetMap, see config/ports.json
# (generated by scripts/fetch_ports.py) and minicop/ports.py.
