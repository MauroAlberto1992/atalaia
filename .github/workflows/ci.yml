# Same guardrails as .pre-commit-config.yaml, enforced on every push and PR.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Real TimescaleDB + PostGIS for the integration tests (same image as compose).
    services:
      db:
        image: timescale/timescaledb-ha:pg17.12-ts2.32.1
        env:
          POSTGRES_DB: minicop_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/minicop_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Builds both images, starts the stack and smoke-tests it through nginx.
    # The dummy key makes aisstream reject the subscription (the service keeps
    # retrying), but every endpoint must still answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'AISSTREAM_API_KEY=dummy-key-for-smoke-test\nMINICOP_AREA=algarve\nPOSTGRES_PASSWORD=ci-only-password\n' > .env
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - run: python scripts/smoke_test.py http://localhost:8080
      # The backend reached the database and applied the migrations. (No rows
      # are written here: with a dummy key there is no AIS feed.)
      - name: Backend is connected to the database
        run: |
          # The recorder connects right after startup; allow it up to 30 s.
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/health \
              | python -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('db_connected') else 1)"; then
              echo "db_connected after ${i}s"; exit 0
            fi
            sleep 1
          done
          curl -s http://localhost:8080/api/health; exit 1
      # A real browser against the production images: the HTTP smoke test
      # passed while the map was blank (missing / mistyped MapLibre worker).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node e2e/browser-check.mjs http://localhost:8080
        working-directory: frontend
      - name: Backend runs as non-root
        run: test "$(docker compose exec -T backend id -u)" != "0"
      - name: No .env inside the images
        run: |
          for svc in backend frontend; do
            test "$(docker compose exec -T $svc sh -c 'find / -name .env -not -path "/proc/*" 2>/dev/null | wc -l')" = "0"
          done
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
