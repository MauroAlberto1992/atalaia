# Serves the built app and proxies the backend, mirroring the Vite dev server
# (vite.config.ts), so the frontend code is the same in dev and in Docker.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # GET /api/tracks -> http://backend:8000/tracks (the trailing slash in
    # proxy_pass strips the /api prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # WebSocket: HTTP/1.1 plus the Upgrade/Connection headers.
    location /live {
        proxy_pass http://backend:8000/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # nginx closes a proxied connection after 60 s without data by default.
        # A quiet sea can easily be silent that long, so allow 1 h.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
