# Guardrails that run before every commit (`pre-commit install` once per clone).
# The same checks run in CI (.github/workflows/ci.yml), because a local hook
# can be skipped with --no-verify; CI cannot.
#
# Project checks are `language: system`: they use the backend venv and the
# frontend node_modules you already have, so versions match what you run by hand.
# Activate the backend venv before committing.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^backend/data/  # raw exports (e.g. overpass-turbo) are kept byte-for-byte
      - id: trailing-whitespace
        exclude: ^backend/data/

  # Secrets: blocks commits containing API keys, tokens, etc.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Dockerfile linter (pinned base images, apt/pip best practices, ...).
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff (lint + format check)
        entry: bash -c 'cd backend && ruff check . && ruff format --check .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: backend-mypy
        name: backend mypy (strict)
        entry: bash -c 'cd backend && mypy'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: backend-pytest
        name: backend pytest
        entry: bash -c 'cd backend && python -m pytest -q'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend eslint
        entry: bash -c 'cd frontend && npm run -s lint'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend tsc
        entry: bash -c 'cd frontend && npm run -s typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-test
        name: frontend vitest
        entry: bash -c 'cd frontend && npm test -s'
        language: system
        files: ^frontend/
        pass_filenames: false
